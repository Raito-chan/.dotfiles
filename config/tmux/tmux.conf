unbind r
bind r source-file ~/.config/tmux/tmux.conf

set -g default-shell /usr/sbin/zsh

set -sa terminal-overrides ",xterm*:Tc"

#set -ag terminal-overrides ",xterm-256color:RGB"
unbind C-b
set -g prefix C-Space

set -g mouse on

set-window-option -g mode-keys vi

# Starts windows and panes at index 1
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

bind-key h select-pane -L
bind-key j select-pane -D
bind-key k select-pane -U
bind-key l select-pane -R

set-option -g status-position bottom

# set -g @catppuccin_flavor "mocha"
# set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text "#{E:@catppuccin_status_application}"
# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'catppuccin/tmux'

set -g status-left ""
set -g status-right "#{E:@catppuccin_status_application} #{E:@catppuccin_status_session}"

# Update window names frequently
set-option -g status-interval 2

# Enable automatic renaming based on the current command
set-option -g automatic-rename on

# Use the running command as the window title
set-option -g automatic-rename-format "#{E:@catppuccin_status_application}"

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
run '/usr/share/tmux-plugin-manager/tpm'



# Remove hostname, keep Catppuccin styling
set -g status-style bg=default
